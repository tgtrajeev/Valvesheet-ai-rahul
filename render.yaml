services:
  - type: web
    name: valve-agent-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # All three DB URLs point at existing external Postgres instances —
      # values set manually in the Render dashboard, not auto-provisioned.
      - key: DATABASE_URL
        sync: false
      - key: VALVE_AGENT_DATABASE_URL
        sync: false
      - key: PMS_GENERATOR_DATABASE_URL
        sync: false
      - key: AGENT_MODEL
        value: claude-sonnet-4-6
      - key: AGENT_TEMPERATURE
        value: "0.1"
      - key: AGENT_MAX_TOOL_CALLS
        value: "25"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
